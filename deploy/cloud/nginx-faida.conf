# /etc/nginx/sites-available/faida  (setup.sh fills in the domain; certbot adds TLS)
server {
    listen 80;
    server_name DOMAIN;

    client_max_body_size 20m;   # counter uploads after a long time offline

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
